[package]
name = "syntra_sandbox"
version = "0.1.0"
edition = "2021"

[dependencies]
syntra_diagnostics = { path = "../diagnostics" }
syntra_syntax = { path = "../syntax" }
syntra_frontend = { path = "../frontend" }
syntra_air = { path = "../air" }
syntra_opt = { path = "../opt" }
syntra_analysis = { path = "../analysis" }
syntra_backend_cranelift = { path = "../backend_cranelift" }
syntra_provenance = { path = "../provenance" }
syntra_intelligence = { path = "../intelligence" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[[bin]]
name = "syntra-sandbox-supervisor"
path = "src/bin/syntra_sandbox_supervisor.rs"
