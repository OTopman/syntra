[workspace]
members = [
    "crates/diagnostics",
    "crates/syntax",
    "crates/frontend",
    "crates/air",
    "crates/opt",
    "crates/backend_cranelift",
    "crates/runtime",
    "crates/provenance",
    "crates/intelligence",
    "crates/analysis",
    "crates/sandbox",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Syntra Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2.0"
ariadne = "0.4"
logos = "0.14"
clap = { version = "4.5", features = ["derive"] }

# Cranelift native compiler dependencies
cranelift-codegen = { version = "0.125.4", features = ["x86", "arm64"] }
cranelift-frontend = "0.125.4"
cranelift-module = "0.125.4"
cranelift-native = "0.125.4"
cranelift-object = "0.125.4"
target-lexicon = "0.13"

# Internal workspace crates
syntra_diagnostics = { path = "crates/diagnostics" }
syntra_syntax = { path = "crates/syntax" }
syntra_frontend = { path = "crates/frontend" }
syntra_air = { path = "crates/air" }
syntra_opt = { path = "crates/opt" }
syntra_backend_cranelift = { path = "crates/backend_cranelift" }
syntra_runtime = { path = "crates/runtime" }
syntra_provenance = { path = "crates/provenance" }
syntra_intelligence = { path = "crates/intelligence" }
syntra_analysis = { path = "crates/analysis" }
syntra_sandbox = { path = "crates/sandbox" }
