[workspace]
members = [
    "crates/diagnostics",
    "crates/syntax",
    "crates/frontend",
    "crates/air",
    "crates/runtime",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aether Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2.0"
ariadne = "0.4"
logos = "0.14"
clap = { version = "4.5", features = ["derive"] }

# Internal workspace crates
aether_diagnostics = { path = "crates/diagnostics" }
aether_syntax = { path = "crates/syntax" }
aether_frontend = { path = "crates/frontend" }
aether_air = { path = "crates/air" }
aether_runtime = { path = "crates/runtime" }
